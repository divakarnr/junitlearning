name: Java Hello World CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the source code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up the Java Development Kit (JDK) environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Compile the raw Java file into bytecode
    - name: Compile Java Application
      run: |
	    mkdir bin
		javac -d bin src/junitLearning/Main.java

    # Step 4: Run the compiled Java class file
    - name: Run Java Application
      run: java -cp bin junitLearning.HelloWorld
