name: ci cd learning11

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
	- name: checkout code here
    - uses: actions/checkout@v4
	
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
		# Step 3: Compile the raw Java file into bytecode
   - name: Compile Java Application
	   run: javac Main.java

		# Step 4: Run the compiled Java class file
   - name: Run Java Application
	   run: java Main
       
  